name: NOTE記事 自動アップグレード（Gemini無料版）

on:
  schedule:
    - cron: '0 */6 * * *'   # 6時間ごと
  workflow_dispatch:
    inputs:
      max_articles:
        description: '処理する最大記事数'
        required: false
        default: '3'

jobs:
  upgrade-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-generativeai

      - name: Run article upgrade flow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MAX=${{ github.event.inputs.max_articles || '3' }}
          python src/article_flow.py --batch --max $MAX

      - name: Commit upgraded articles
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add outputs/
          git diff --staged --quiet || git commit -m "🤖 記事自動アップグレード $(date +'%Y-%m-%d %H:%M')"
          git push
